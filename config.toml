# basic config
baseURL = "https://jcleal.me/"
languageCode = "en-us"
title="Jordan Cleal"
theme = "hugo-ink"
paginate = 3

# https://xyproto.github.io/splash/docs/all.html
pygmentsstyle = "dracula"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark.renderer]
    unsafe = true

[params]
    mainSections = ["posts"]
    subtitle = "A DevOps Engineer focused on Go, Bash, & AWS."
    featherIconsCDN = true
    avatar = "/my-face.jpg"
    mode = "dark"
    customCSS = "css/custom.css"
    customDarkCSS = "css/custom.dark.css"

# navigation
[[menu.main]]
name = "About"
url = "/"
weight = 1

[[menu.main]]
name = "Resume"
url = "/resume"
weight = 2

[[menu.main]]
name = "Workshops"
url = "/workshops"
weight = 3

[[menu.main]]
name = "Blog"
url = "/posts"
weight = 4

[[menu.main]]
name = "Blog Tags"
url = "/tags"
weight = 5

[[menu.main]]
name = "Contact"
url = "/contact"
weight = 6

