---
name: CI/CD
on:
  push:
    paths:
    - '.github/workflows/cicd.yml'
    - 'cf/**'
    - 'cmd/**'
    - 'content/**'
    - 'e2e/**'
    - 'layouts/**'
    - 'resume/**'
    - 'static/**'
    - 'themes/**'
    - 'package*.json'
    - 'vitest.config.js'
    - 'config.toml'
    - '**Dockerfile'
    - 'Makefile*'
  workflow_dispatch:
  repository_dispatch:
    types: [update-cicd]

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  lint:
    uses: jmpa-io/pipelines/.github/workflows/10-lint.yml@9884789a83c7bd495a1852ae9cc605a270440383 # main (adds account_id)
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}
      ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}

  build-website:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@v4

      - name: Checkout theme submodule.
        run: git submodule update --init themes/hugo-ink

      - name: Generate website.
        run: make generate-website

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: jcleal.me
          path: dist/public
          if-no-files-found: error
          retention-days: 7

  test-website:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@v4

      - name: Checkout theme submodule.
        run: git submodule update --init themes/hugo-ink

      - name: Setup node.
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Run unit tests (palette.js).
        run: npm ci && npm test

      # The base URL and hugo version must match e2e/site.ts and cmd/hugo/Dockerfile.
      - name: Build website for e2e.
        run: >-
          docker run --rm -v "$PWD:/src" -w /src hugomods/hugo:exts-0.139.0
          hugo --baseURL http://localhost:4171/ --destination public --quiet

      - name: Run e2e tests (Playwright, system Chrome).
        working-directory: e2e
        run: npm ci && npx playwright test

      - name: Upload e2e report.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Deploys only run from main; tests run on every branch.
  deploy:
    needs: [build-website, test-website]
    uses: jmpa-io/pipelines/.github/workflows/40-deploy-to-aws.yml@9884789a83c7bd495a1852ae9cc605a270440383 # main (adds account_id)
    with:
      templates: website
      account_id: '213851291874' # the dev AWS account.
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}

  upload-website:
    needs: [deploy]
    uses: jmpa-io/pipelines/.github/workflows/50-upload-artifacts-to-s3.yml@9884789a83c7bd495a1852ae9cc605a270440383 # main (adds account_id)
    with:
      artifact: jcleal.me
      account_id: '213851291874' # the dev AWS account.
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}

  # Prove the dev copy serves a directory URL (the home page and a subpage) before anything else
  # builds on it. CloudFront can lag a few seconds behind the stack update, so retry.
  smoke-test:
    needs: [upload-website]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS.
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::213851291874:role/${{ secrets.AWS_RUNNER_ROLE_NAME || 'github-actions' }}
          role-session-name: github-actions
          aws-region: ap-southeast-2

      - name: Fetch the dev site.
        run: |
          password=$(aws ssm get-parameter --name /common/dev-site-auth/password --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$password"
          for path in / /workshops/; do
            curl -fsS --retry 8 --retry-delay 15 --retry-all-errors -u "dev:$password" -o /dev/null "https://dev.jcleal.me${path}"
            echo "ok https://dev.jcleal.me${path}"
          done

  # Promote to prod: when this lands on main, publish the exact artifact that just passed the dev smoke test to the live
  # site (prod account), then check the live URLs. Merging to main starts the promotion; the approval gate below lets it through.
  # Approval gate: the `prod` environment (repo Settings > Environments) requires a reviewer, so the run waits here until the
  # publish is approved on GitHub. Nothing reaches prod without it.
  approve-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [smoke-test]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Approved to publish to prod.
        run: echo "Approved."

  # Prod infrastructure: the same template as dev, applied to the prod account once the approval above is given.
  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [approve-prod]
    uses: jmpa-io/pipelines/.github/workflows/40-deploy-to-aws.yml@9884789a83c7bd495a1852ae9cc605a270440383 # v1.1.0
    with:
      templates: website
      environment: prod
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}

  publish-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-prod]
    uses: jmpa-io/pipelines/.github/workflows/50-upload-artifacts-to-s3.yml@9884789a83c7bd495a1852ae9cc605a270440383 # main (adds account_id)
    with:
      artifact: jcleal.me
      environment: prod
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}

  smoke-test-prod:
    needs: [publish-prod]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the live site.
        run: |
          for path in / /workshops/; do
            curl -fsS --retry 8 --retry-delay 15 --retry-all-errors -o /dev/null "https://jcleal.me${path}"
            echo "ok https://jcleal.me${path}"
          done

  post-to-slack:
    needs: [lint, build-website, test-website, deploy, upload-website, smoke-test, approve-prod, deploy-prod, publish-prod, smoke-test-prod]
    if: always()
    uses: jmpa-io/pipelines/.github/workflows/99-post-to-slack.yml@9884789a83c7bd495a1852ae9cc605a270440383 # main (adds account_id)
    with:
      needs: ${{ toJSON(needs) }}
    secrets:
      WEBHOOK: ${{ secrets.SLACK_GITHUB_NOTIFICATIONS_WEBHOOK }}

