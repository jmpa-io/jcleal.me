<!DOCTYPE html>
<html {{ if eq .Site.Params.mode "dark" }}class="dark"{{ end }}>
{{ partial "header.html" . }}
<body>
	<div class="container wrapper">
		{{ partial "head.html" . }}

		<div class="post">
			<div class="post-header">
				<div class="matter">
					<h1 class="title">{{ .Title }}</h1>
				</div>
			</div>

			<div class="markdown">
				{{ if eq .File.BaseFileName "resume" }}
				<div class="resume-heading-row">
					<h1 id="jordan-cleal">Jordan Cleal.</h1>
					<a class="pdf-download-btn" href="/resume.pdf"><i data-feather="download"></i> Download PDF</a>
				</div>
				{{ end }}
				{{ .Content }}
			</div>
		</div>
	</div>
	{{ partial "footer.html" . }}
</body>
</html>
