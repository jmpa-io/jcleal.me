<!DOCTYPE html>
<html {{- if (eq .Site.Params.mode "dark" ) -}}class="dark" {{ end }}>
{{ partial "header.html" . }}
<link rel="stylesheet" href="/css/labs.css" />
<body class="labs">
  <div class="container wrapper">
    {{ partial "head.html" . }}
    <div class="post">
      <div class="post-header">
        <div class="matter">
          <h1 class="title">{{ .Title }}</h1>
        </div>
      </div>
      <div class="markdown">
        <div class="ws-wrap">
          <aside class="ws-sidebar">
            <h4>{{ .Title }}</h4>
            {{ range .Data.Pages }}
              <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ end }}
          </aside>
          <div class="ws-main">
            {{ .Content }}
            <div class="ws-pdf-bar">
              <span>Download the full workshop as a PDF — free.</span>
              <a class="ws-pdf-btn" href="/pdf/bash-101.pdf" download>Download PDF ↓</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  {{ partial "footer.html" . }}
</body>
</html>
