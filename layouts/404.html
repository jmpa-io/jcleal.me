<!DOCTYPE html>
<html {{ if eq .Site.Params.mode "dark" }}class="dark"{{ end }}>
{{ partial "header.html" . }}
<body>
	<div class="container wrapper">
		{{ partial "head.html" . }}

		<div class="post">
			<div class="post-header">
				<div class="matter">
					<h1 class="title">Page not found</h1>
				</div>
			</div>

			<div class="markdown">
				<p>That page doesn't exist (any more). Head back to the <a href="/">home page</a> or the <a href="/posts/">blog</a>.</p>
			</div>
		</div>
	</div>

	{{ partial "footer.html" . }}
</body>
</html>
